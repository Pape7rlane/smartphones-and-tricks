plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

layout.buildDirectory = file('../.gradle-build/app')

def serverAssets = layout.buildDirectory.dir('generated/serverAssets')
def syncServerAssets = tasks.register('syncServerAssets', Sync) {
    from(rootProject.file('build'))
    into(serverAssets.map { it.dir('server') })
}

android {
    namespace 'com.ppsr.control'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ppsr.control'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '4.6.53'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { assets.srcDir(serverAssets) } }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.14'
        // Chaquopy normally imports every module straight out of the APK through
        // its JNI-backed AssetFinder, which is far slower than the normal
        // filesystem importer (~150-200 ms per module on device). Extracting the
        // packages makes the same modules available as real files under
        // files/chaquopy/AssetFinder, and app_bridge then imports them from disk
        // (see _prefer_extracted_modules). Extraction itself only runs once: on
        // later launches unchanged files are skipped.
        extractPackages '*'
        pip {
            // MarkupSafe doesn't currently publish a Python 3.14 Android wheel.
            // All dependencies are explicit so its official pure-Python fallback
            // can be bundled from app/src/main/python/markupsafe.
            options '--no-deps'
            // Native protobuf wheels cross-compiled for Android (see
            // .github/workflows/android.yml). When present, pip picks them over
            // the pure-Python wheel so the server gets the fast upb backend;
            // when absent, the build still works with pure Python.
            // Use an absolute path: a relative --find-links value is resolved
            // against pip's working directory (the app module), not the repo
            // root, so the plain 'wheels' never resolved and pip silently fell
            // back to the pure-Python wheel from PyPI.
            options '--find-links', rootProject.file('wheels').absolutePath
            install 'Flask==3.1.2'
            install 'Werkzeug==3.1.3'
            install 'Jinja2==3.1.6'
            install 'itsdangerous==2.2.0'
            install 'click==8.1.8'
            install 'blinker==1.9.0'

            install 'requests==2.32.5'
            install 'chardet==5.2.0'
            install 'idna==3.10'
            install 'urllib3==2.5.0'
            install 'certifi==2025.8.3'

            install 'protobuf==6.30.2'

            install 'dataclasses-json==0.6.7'
            install 'marshmallow==3.26.1'
            install 'typing-inspect==0.9.0'
            install 'mypy-extensions==1.1.0'
            install 'typing-extensions==4.15.0'
            install 'packaging==25.0'
        }
    }
}

tasks.named('preBuild').configure { dependsOn(syncServerAssets) }
